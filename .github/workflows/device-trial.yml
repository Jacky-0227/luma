name: Build Luma for device testing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luma-device-trial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and validate an iPhone test package
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      COCOAPODS_DISABLE_STATS: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate source metadata
        run: python3 scripts/validate-project.py

      - name: Prepare pinned build tools and dependency
        run: bash scripts/ci-bootstrap.sh

      - name: Compile and validate iPhone IPA
        run: bash scripts/ci-package.sh

      - name: Upload device test package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Luma-device-trial-unsigned
          path: build/output/Luma-unsigned.ipa
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Luma-device-trial-diagnostics
          path: |
            build/Diagnostics/
            build/device-build.log
          if-no-files-found: warn
          retention-days: 1

      - name: Describe validation scope
        run: |
          {
            echo '### Device test package'
            echo 'Release compilation and IPA structure validation passed.'
            echo 'This manual workflow does not run simulator tests. Install locally to verify camera compatibility and performance.'
            echo 'The unsigned IPA must be signed locally before installation.'
          } >> "$GITHUB_STEP_SUMMARY"
